[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "tf-mcts"
dynamic = ["version"]
description = "Monte Carlo tree search in Tensorflow."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    {name = "Cyril Marlin"},
]
keywords = [
    "tensorflow",
    "planning",
    "reinforcement-learning",
    "python",
    "machine learning",
]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tensorflow>=2.12",
]

[tool.flit.module]
# The distribution is tf-mcts, the import package keeps mctx's name.
name = "mctx"

[project.urls]
homepage = "https://github.com/cmarlin/tf-mcts"
repository = "https://github.com/cmarlin/tf-mcts"

[project.optional-dependencies]
test = [
    "absl-py>=0.9.0",
    "numpy>=1.18.0",
]
examples = [
    "absl-py>=0.9.0",
    "pygraphviz>=1.7",
]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W291",  # whitespace at the end of the line
    "B023",  # pylint's cell-var-over-loop, closures capturing variables in loop
]
ignore = [
    "E731",  # lambdas are allowed
    "F401",  # allow unused imports
    "E402",  # allow modules not at top of file
    "E741",  # allow "l" as a variable name
    "E703",  # allow semicolons (for jupyter notebooks)
]

# We include pyink to allow external contributors to optionally, but easily,
# pass google internal formatting checks.
[tool.pyink]
pyink = true  # false would mean black is used directly without pyink features
pyink-use-majority-quotes = true
pyink-indentation = 2
line-length = 80
include = '\.pyi?$'
